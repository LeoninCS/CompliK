name: Build Image

on:
  workflow_call:
    inputs:
      context:
        description: Docker build context.
        required: true
        type: string
      image:
        description: Container image repository.
        required: true
        type: string
      artifact-name-prefix:
        description: Prefix for the digest artifact name.
        required: true
        type: string
      arch:
        description: Target CPU architecture.
        required: true
        type: string
      runs-on:
        description: GitHub Actions runner label.
        required: true
        type: string

jobs:
  build:
    name: Build ${{ inputs.image }} (${{ inputs.arch }})
    permissions:
      contents: read
      packages: write
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.image }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/${{ inputs.arch }}
          outputs: type=image,"name=${{ inputs.image }}",name-canonical=true,push-by-digest=${{ github.event_name != 'pull_request' }},push=${{ github.event_name != 'pull_request' }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact-name-prefix }}-${{ inputs.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
