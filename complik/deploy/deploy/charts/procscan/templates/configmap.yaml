apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "procscan.fullname" . }}-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "procscan.labels" . | nindent 4 }}
data:
  config.yaml: |
    scanner:
      proc_path: {{ .Values.config.scanner.proc_path | quote }}
      scan_interval: {{ .Values.config.scanner.scan_interval | quote }}
      log_level: {{ .Values.config.scanner.log_level | quote }}

    actions:
      label:
        enabled: {{ .Values.config.actions.label.enabled }}
        data:
          {{- toYaml .Values.config.actions.label.data | nindent 10 }}

    notifications:
      admin:
        base_url: {{ .Values.config.notifications.admin.base_url | quote }}
        timeout: {{ .Values.config.notifications.admin.timeout | quote }}
        basic_auth:
          username: {{ .Values.config.notifications.admin.basic_auth.username | quote }}
          password: {{ .Values.config.notifications.admin.basic_auth.password | quote }}
